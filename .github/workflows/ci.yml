name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Типы и тесты (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          GEMMACODE_CHROME_NO_SANDBOX: '1'
      - name: Сборка окна
        run: npm run build --workspace @gemmacode/desktop

  # Windows и macOS: тесты идут, но пока не блокируют слияние (песочница ОС и пути на них проверялись меньше всего)
  test-other:
    name: Тесты (${{ matrix.os }}, не блокирует)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
