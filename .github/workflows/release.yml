name: Релиз

# Тег vX.Y.Z собирает установщики на родных раннерах (так в пакет попадают нативные модули своей платформы),
# считает контрольные суммы и публикует релиз. Сборки не подписаны (см. README).
on:
  push:
    tags: ['v*']
  # ручной запуск (когда тег нельзя поставить снаружи): сборка и релиз для указанного тега, тег создаёт сам релиз
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v0.5.0 (пусто — только сборка без релиза)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Сборка (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            script: dist:mac
          - os: ubuntu-22.04
            script: dist:linux
          - os: windows-2022
            script: dist:win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Установщик
        working-directory: apps/desktop
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe

  publish:
    name: Публикация релиза
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Контрольные суммы
        working-directory: dist
        run: |
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          notes="$(awk -v v="${tag#v}" '$0 ~ "^## \\[?"v {f=1; next} f && /^## / {exit} f' CHANGELOG.md)"
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "GemmaCode ${tag#v}" --prerelease --notes "${notes:-Бета-сборка. Подробности в CHANGELOG.md.}"
